services:
  # ─── Reverse Proxy ────────────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - downloads_volume:/app/downloads:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
    networks:
      - melodex_net

  # ─── Frontend ─────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    environment:
      - NEXT_PUBLIC_API_URL=http://nginx/api
      - NEXT_PUBLIC_WS_URL=ws://nginx/ws
    restart: unless-stopped
    networks:
      - melodex_net

  # ─── Backend API ──────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgresql+asyncpg://melodex:melodex_pass@postgres:5432/melodex
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - STORAGE_PATH=/app/downloads
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-production}
      - ENVIRONMENT=production
      - MAX_CONCURRENT_DOWNLOADS=20
      - RATE_LIMIT_PER_IP=30
      - CORS_ORIGINS=["http://localhost","http://localhost:3000","http://localhost:80"]
    volumes:
      - downloads_volume:/app/downloads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - melodex_net

  # ─── Celery Workers ───────────────────────────────────────────────────
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    environment:
      - DATABASE_URL=postgresql+asyncpg://melodex:melodex_pass@postgres:5432/melodex
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - STORAGE_PATH=/app/downloads
      - ENVIRONMENT=production
    volumes:
      - downloads_volume:/app/downloads
    depends_on:
      - redis
      - postgres
    restart: unless-stopped
    networks:
      - melodex_net

  # ─── Celery Beat (scheduler) ─────────────────────────────────────────
  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    command: celery -A app.workers.celery_app beat --loglevel=info
    environment:
      - DATABASE_URL=postgresql+asyncpg://melodex:melodex_pass@postgres:5432/melodex
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - STORAGE_PATH=/app/downloads
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - melodex_net

  # ─── Flower (Celery Monitor) ─────────────────────────────────────────
  # flower:
  #   build:
  #     context: ./backend
  #     dockerfile: Dockerfile.worker
  #   command: celery -A app.workers.celery_app flower --port=5555 --broker=redis://redis:6379/1
  #   ports:
  #     - "5555:5555"
  #   environment:
  #     - CELERY_BROKER_URL=redis://redis:6379/1
  #     - CELERY_RESULT_BACKEND=redis://redis:6379/2
  #     - REDIS_URL=redis://redis:6379/0
  #   depends_on:
  #     redis:
  #       condition: service_healthy
  #   restart: unless-stopped
  #   networks:
  #     - melodex_net

  # ─── PostgreSQL ──────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=melodex
      - POSTGRES_USER=melodex
      - POSTGRES_PASSWORD=melodex_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U melodex"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - melodex_net

  # ─── Redis ───────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - melodex_net

  # ─── Prometheus ──────────────────────────────────────────────────────
  # prometheus:
  #   image: prom/prometheus:latest
  #   volumes:
  #     - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
  #     - prometheus_data:/prometheus
  #   ports:
  #     - "9090:9090"
  #   restart: unless-stopped
  #   networks:
  #     - melodex_net

  # ─── Grafana ─────────────────────────────────────────────────────────
  # grafana:
  #   image: grafana/grafana:latest
  #   environment:
  #     - GF_SECURITY_ADMIN_PASSWORD=melodex_grafana
  #     - GF_USERS_ALLOW_SIGN_UP=false
  #   volumes:
  #     - grafana_data:/var/lib/grafana
  #   ports:
  #     - "3001:3000"
  #   depends_on:
  #     - prometheus
  #   restart: unless-stopped
  #   networks:
  #     - melodex_net

volumes:
  postgres_data:
  redis_data:
  downloads_volume:
  prometheus_data:
  grafana_data:

networks:
  melodex_net:
    driver: bridge
